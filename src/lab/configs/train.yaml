hydra:
  run:
    dir: ${writer.log_dir}

defaults:
  - _self_
  - dataset: kolmogorov
  - dataloader: default
  - model: fm_unet
  - criterion: fm
  - path: fm
  - metrics: none
  - transforms: kolmogorov
  - optimizer: default
  - lr_scheduler: default
  - writer: cometml

trainer:
  # Steps
  total_steps: 40000 # total optimizer steps (40000 * 256 = ~1250 epochs of the 8192 train fields)
  eval_every_steps: 2000 # validation frequency (a checkpoint to resume from is also saved)
  checkpoint_every_steps: 10000 # periodic checkpoints kept
  grad_accum_steps: 1 # batches per optimizer step (effective batch size = batch_size * grad_accum_steps)

  # Logging
  log_step: 100 # optimizer steps between train logs
  log_images: 16 # generated fields in the logged grid of vorticities (0 = no images)
  sample_steps: 32 # Euler ODE steps to generate the logged fields
  debug: false # true to measure data_time / step_time (waits for the device at each step)

  # Checkpoints
  checkpoint_dir: ${writer.log_dir}/checkpoints
  # Saved: at every evaluation, every checkpoint_every_steps (unless only_best) and at the last
  # step. Kept: the periodic ones, the best one and the latest one (to resume from); the others
  # are deleted right after the save. The monitor can use the eval metrics ('<part>_<name>') and the train ones ('train_<name>').
  resume_from: null # null, the step of a checkpoint in checkpoint_dir (e.g. 1000) or "latest"
  from_pretrained: null # null or checkpoint directory of a step (e.g. .../checkpoints/1000) to take the weights from
  from_pretrained_ema: false # take the EMA weights of from_pretrained instead of the raw ones
  only_best: false # true to skip the periodic checkpoints (requires monitor)
  monitor: "min val_fm" # "off" or "<min|max> <metric_name>"; keeps the best checkpoint
  early_stop: null # evaluations without improvement before stopping (requires monitor)

  # Hardware and numerics
  device: auto # "auto" or a jax platform ("cpu", "gpu", "tpu")
  device_tensors: ["x", "cond"] # batch entries passed to the jitted steps
  use_bfloat16: true # bfloat16 compute in the train steps
  # Precision of the float32 matmuls/convs: "default", "high" (3 bf16 passes) or "highest" (full
  # float32). On TPU "default" is one bf16 pass, on recent GPUs TF32; no effect on bf16 compute
  matmul_precision: default
  # The evaluation and the logged samples: float32 for honest divergence metrics
  eval_use_bfloat16: false
  eval_matmul_precision: highest
  jit: true # false to run the steps without jax.jit (for debugging)
  max_grad_norm: 1.0 # null = no gradient clipping

  # Run
  seed: 42 # init, training randomness and train data order
  eval_seed: 0 # noise and times of the evaluation and the logged samples (the same for all runs)
  override: false # overwrite an existing run dir with the same writer.run_name
  ema: # null to disable
    decay: 0.999
    update_every: 1 # optimizer steps between EMA updates
    warmup_steps: 0 # steps with linearly increasing decay (0 = disabled)
