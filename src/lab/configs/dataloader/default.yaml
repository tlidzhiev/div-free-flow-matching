train:
  batch_size: 256
  shuffle: true
  seed: ${oc.select:trainer.seed,42} # shuffle seed
  drop_remainder: true # keep the batch shape static for jit
  num_threads: 4 # threads reading the data in the main process
  prefetch_buffer_size: 8 # batches
  num_workers: 0 # > 0 to load the data in worker processes (0 = in the main process)
  per_worker_buffer_size: 1

val:
  batch_size: 256 # 1024 / 256: no smaller last batch, no extra compilation
  shuffle: false
  drop_remainder: false
  num_threads: 4
  prefetch_buffer_size: 8
  num_workers: 0
  per_worker_buffer_size: 1

test:
  batch_size: 256 # 2048 / 256
  shuffle: false
  drop_remainder: false
  num_threads: 4
  prefetch_buffer_size: 8
  num_workers: 0
  per_worker_buffer_size: 1
