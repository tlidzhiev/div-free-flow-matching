train:
  accuracy:
    _target_: lab.metrics.accuracy.AccuracyMetric.configure
    num_classes: ${model.num_classes}
inference:
  accuracy:
    _target_: lab.metrics.accuracy.AccuracyMetric.configure
    num_classes: ${model.num_classes}
